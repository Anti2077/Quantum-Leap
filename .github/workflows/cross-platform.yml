name: Cross-platform desktop builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_build:
        description: Generate updater signatures for a manually assembled release
        required: true
        default: false
        type: boolean

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev dbus-x11 gnome-keyring
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Build and smoke-test iperf3 sidecar
        run: |
          npm run sidecar:linux
          scripts/smoke-test-iperf-sidecar.sh src-tauri/binaries/iperf3-x86_64-unknown-linux-gnu
          file src-tauri/binaries/iperf3-x86_64-unknown-linux-gnu
      - name: Rust tests with Secret Service
        run: |
          dbus-run-session -- bash -c '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            export QUANTUM_LEAP_CREDENTIAL_TEST=1
            cargo test --manifest-path src-tauri/Cargo.toml --locked
          '
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: Build AppImage and DEB
        if: github.event_name != 'workflow_dispatch' || inputs.release_build != true
        run: npm run tauri:build -- --bundles appimage,deb
      - name: Build signed AppImage and DEB release artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.release_build == true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm run tauri:build -- --bundles appimage,deb --config src-tauri/tauri.updater.conf.json
      - name: Inspect Linux packages
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          chmod +x "$APPIMAGE"
          (cd /tmp && "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract >/dev/null)
          find /tmp/squashfs-root -type f | grep -E '/iperf3$'
          find /tmp/squashfs-root -type f | grep -E 'third-party/iperf3-LICENSE$'
          find /tmp/squashfs-root -type f | grep -E '/LICENSE$'
          find /tmp/squashfs-root -type f | grep -E '/THIRD_PARTY_NOTICES.md$'
          dpkg-deb --contents "$DEB" | grep -E '/iperf3$'
          dpkg-deb --contents "$DEB" | grep -E 'third-party/iperf3-LICENSE$'
          dpkg-deb --contents "$DEB" | grep -E '/LICENSE$'
          dpkg-deb --contents "$DEB" | grep -E '/THIRD_PARTY_NOTICES.md$'
          sha256sum "$APPIMAGE" "$DEB" > src-tauri/target/release/bundle/SHA256SUMS-linux-x64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quantum-leap-linux-x64-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/SHA256SUMS-linux-x64.txt

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev dbus-x11 gnome-keyring xdg-utils
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Build and smoke-test iperf3 sidecar
        run: |
          npm run sidecar:linux
          scripts/smoke-test-iperf-sidecar.sh src-tauri/binaries/iperf3-aarch64-unknown-linux-gnu
          file src-tauri/binaries/iperf3-aarch64-unknown-linux-gnu | grep -F 'ARM aarch64'
      - name: Rust tests with Secret Service
        run: |
          dbus-run-session -- bash -c '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            export QUANTUM_LEAP_CREDENTIAL_TEST=1
            cargo test --manifest-path src-tauri/Cargo.toml --locked
          '
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: Build AppImage and DEB
        if: github.event_name != 'workflow_dispatch' || inputs.release_build != true
        run: npm run tauri:build -- --bundles appimage,deb
      - name: Build signed AppImage and DEB release artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.release_build == true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm run tauri:build -- --bundles appimage,deb --config src-tauri/tauri.updater.conf.json
      - name: Inspect Linux packages
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          chmod +x "$APPIMAGE"
          file "$APPIMAGE" | grep -F 'ARM aarch64'
          test "$(dpkg-deb --field "$DEB" Architecture)" = "arm64"
          (cd /tmp && "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract >/dev/null)
          find /tmp/squashfs-root -type f | grep -E '/iperf3$'
          find /tmp/squashfs-root -type f | grep -E 'third-party/iperf3-LICENSE$'
          find /tmp/squashfs-root -type f | grep -E '/LICENSE$'
          find /tmp/squashfs-root -type f | grep -E '/THIRD_PARTY_NOTICES.md$'
          file "$(find /tmp/squashfs-root -type f -name iperf3 -print -quit)" | grep -F 'ARM aarch64'
          dpkg-deb --contents "$DEB" | grep -E '/iperf3$'
          dpkg-deb --contents "$DEB" | grep -E 'third-party/iperf3-LICENSE$'
          dpkg-deb --contents "$DEB" | grep -E '/LICENSE$'
          dpkg-deb --contents "$DEB" | grep -E '/THIRD_PARTY_NOTICES.md$'
          sha256sum "$APPIMAGE" "$DEB" > src-tauri/target/release/bundle/SHA256SUMS-linux-arm64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quantum-leap-linux-arm64-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/SHA256SUMS-linux-arm64.txt

  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Install Cygwin build dependencies
        uses: egor-tensin/setup-cygwin@v4
        with:
          packages: gcc-core make autoconf automake libtool
      - name: Build and smoke-test iperf3 sidecar
        shell: pwsh
        run: |
          scripts/build-iperf-windows.ps1
          scripts/smoke-test-iperf-sidecar.ps1 -Binary src-tauri/binaries/iperf3-x86_64-pc-windows-msvc.exe
      - name: Rust tests with Credential Manager
        shell: pwsh
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notlike 'C:\tools\cygwin\bin*' }) -join ';'
          $env:QUANTUM_LEAP_CREDENTIAL_TEST = "1"
          cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Windows Clippy
        shell: pwsh
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notlike 'C:\tools\cygwin\bin*' }) -join ';'
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: Build portable Windows executable
        shell: pwsh
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notlike 'C:\tools\cygwin\bin*' }) -join ';'
          npm run tauri:build -- --no-bundle
      - name: Package and inspect portable Windows build
        shell: pwsh
        run: |
          $Version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $PortableName = "Quantum-Leap_${Version}_Windows_x64_portable"
          $BundleRoot = "src-tauri/target/release/bundle/portable"
          $PortableDir = Join-Path $BundleRoot $PortableName
          $Archive = Join-Path $BundleRoot "${PortableName}.zip"
          $App = Join-Path $PortableDir "Quantum Leap.exe"

          New-Item -ItemType Directory -Force -Path (Join-Path $PortableDir "third-party") | Out-Null
          Copy-Item "src-tauri/target/release/iperf3_ui.exe" $App
          Copy-Item "src-tauri/binaries/iperf3-x86_64-pc-windows-msvc.exe" (Join-Path $PortableDir "iperf3.exe")
          Copy-Item "src-tauri/binaries/*.dll" $PortableDir
          Copy-Item "src-tauri/binaries/licenses/*" (Join-Path $PortableDir "third-party")
          Copy-Item -Path "LICENSE", "THIRD_PARTY_NOTICES.md" -Destination $PortableDir

          $RequiredFiles = @(
            "Quantum Leap.exe",
            "iperf3.exe",
            "cygwin1.dll",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            "third-party/iperf3-LICENSE",
            "third-party/cygwin-LICENSE"
          )
          foreach ($RelativePath in $RequiredFiles) {
            if (-not (Test-Path -PathType Leaf (Join-Path $PortableDir $RelativePath))) {
              throw "Portable package is missing $RelativePath"
            }
          }

          function Get-PeMachine([string]$Path) {
            $Bytes = [System.IO.File]::ReadAllBytes($Path)
            if ($Bytes.Length -lt 64 -or $Bytes[0] -ne 0x4d -or $Bytes[1] -ne 0x5a) {
              throw "$Path is not a valid PE file"
            }
            $PeOffset = [BitConverter]::ToInt32($Bytes, 0x3c)
            if ($PeOffset -lt 0 -or $PeOffset + 6 -gt $Bytes.Length) {
              throw "$Path has an invalid PE header"
            }
            return [BitConverter]::ToUInt16($Bytes, $PeOffset + 4)
          }

          Get-ChildItem $PortableDir -File | Where-Object { $_.Extension -in ".exe", ".dll" } | ForEach-Object {
            if ((Get-PeMachine $_.FullName) -ne 0x8664) {
              throw "$($_.Name) is not an x64 executable"
            }
          }
          if ((Get-Item $App).VersionInfo.ProductName -ne "Quantum Leap") {
            throw "Portable application metadata has an unexpected product name"
          }

          $Process = Start-Process -FilePath $App -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($Process.HasExited) { throw "Portable application exited during the launch check" }
          } finally {
            if (-not $Process.HasExited) { Stop-Process -Id $Process.Id -Force }
          }

          Compress-Archive -Path $PortableDir -DestinationPath $Archive -CompressionLevel Optimal
          $Extract = Join-Path $env:RUNNER_TEMP "quantum-leap-portable"
          Expand-Archive -Path $Archive -DestinationPath $Extract
          $ArchivedApp = Join-Path (Join-Path $Extract $PortableName) "Quantum Leap.exe"
          if (-not (Test-Path -PathType Leaf $ArchivedApp)) {
            throw "Portable archive has an unexpected directory layout"
          }
          if ((Get-FileHash -Algorithm SHA256 $ArchivedApp).Hash -ne (Get-FileHash -Algorithm SHA256 $App).Hash) {
            throw "Portable archive changed the application executable"
          }

          $Hash = Get-FileHash -Algorithm SHA256 $Archive
          "$($Hash.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($Archive))" |
            Set-Content -Encoding ascii "src-tauri/target/release/bundle/SHA256SUMS-windows-x64.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: quantum-leap-windows-x64-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/portable/*_portable.zip
            src-tauri/target/release/bundle/SHA256SUMS-windows-x64.txt
